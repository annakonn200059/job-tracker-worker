name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: annakonn200059/job-tracker-ci/.github/workflows/python.yml@main
  image:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: annakonn200059/job-tracker-ci/.github/workflows/image.yml@main
    with:
      image-name: job-tracker-worker
